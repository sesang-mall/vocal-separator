<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#e8efe4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>사과게임 10·20·30</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header>
    <h1>사과게임 <span>10·20·30</span></h1>
    <div class="stats">
      <div class="stat"><b id="score">0</b><small>점수</small></div>
      <div class="stat"><b id="best">0</b><small>최고</small></div>
      <div class="stat"><b id="time">120</b><small>남은 초</small></div>
    </div>
  </header>

  <div class="timer" id="timerbar"><i id="timerfill"></i></div>

  <section class="stage">
    <div class="boardbox" id="boardbox">
      <div id="board" role="grid" aria-label="사과 격자"></div>
      <div class="overlay" id="overlay">
        <h2 id="ov-title">합이 10, 20, 30이 되게 묶으세요</h2>
        <p id="ov-text">손가락이나 마우스로 드래그해 사각형으로 묶고, 숫자 합이 10, 20, 30 중 하나이면 사과가 사라집니다. 2분 안에 최대한 많이 지우세요.</p>
        <button id="start" type="button">시작</button>
      </div>
    </div>
  </section>

  <div class="live" id="live" aria-live="polite">&nbsp;</div>
</main>
<script src="game.js"></script>
</body>
</html>
